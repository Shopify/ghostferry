name: ghostferry

env:
  MYSQL_VERSION: "8.0"

up:
  - packages:
      - mysql_client
  - ruby
  - bundler
  - go:
      version: "1.26.2"
  - podman
  - custom:
      name: Go Dependencies
      met?: go mod download
      meet: echo 'go mod failed to download dependencies'; false
  - custom:
      name: MySQL
      met?: podman-compose -f docker-compose_8.0.yml up -d mysql-1 mysql-2
      meet: echo 'mysql failed to start'; false
      down: podman-compose -f docker-compose_8.0.yml stop mysql-1 mysql-2

commands:
  test:
    desc: Run all the tests.
    run: make test
  test-go:
    desc: Run the golang test suite.
    run: make test-go
  test-ruby:
    desc: Run the ruby test suite.
    run: make test-ruby
  docs:
    desc: Serve the documentation locally at http://127.0.0.1:4000/ghostferry/main/ (no deploy).
    run: bundle exec jekyll serve --source docs --destination build/docs --host 127.0.0.1 --port 4000
  docs-build:
    desc: Build the documentation into build/docs and check its links and anchors (no deploy).
    run: |
      bundle exec jekyll build --source docs --destination build/docs
      bundle exec htmlproofer build/docs --disable-external --allow-missing-href --no-enforce-https --swap-urls '^/ghostferry/main/:/'
