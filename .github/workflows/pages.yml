name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: "development:test"
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build documentation
        run: bundle exec jekyll build --source docs --destination build/docs

      - name: Check links and anchors
        run: bundle exec htmlproofer build/docs --disable-external --allow-missing-href --no-enforce-https --swap-urls '^/ghostferry/main/:/'

      - name: Upload documentation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-html
          path: build/docs
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Shopify/ghostferry'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Download documentation
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-html
          path: build/docs

      - name: Deploy current documentation
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/docs
          destination_dir: main
          keep_files: false
          force_orphan: false
          enable_jekyll: false
